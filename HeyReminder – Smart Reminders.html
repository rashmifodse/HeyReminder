<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HeyReminder – Smart Reminders</title>
<style>
:root{--bg:#f4f7fb;--cd:#fff;--tx:#101828;--mu:#667085;--ac:#0f9d8f;--a2:#0b6e8a;--ok:#12a36b;--wa:#e8930c;--er:#e5365a;--bd:#dde3ec;--sh:0 6px 22px rgba(15,110,120,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,#dff4f0,var(--bg) 320px) no-repeat var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:auto;padding:16px 18px 2px}
h1{margin:0;font-size:26px;letter-spacing:-.6px}h2{margin:14px 0 10px;font-size:22px;letter-spacing:-.4px}
h3{margin:24px 0 6px;font-size:17px;color:var(--tx);font-weight:700}
main{max-width:560px;margin:auto;padding:6px 18px 110px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.mu{color:var(--mu)}.sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;min-height:46px;color:var(--tx);background:var(--bd);transition:transform .1s}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ib{width:40px;height:40px;border-radius:50%;padding:0;font-size:18px}
.b2{background:var(--bd)}.er{color:var(--er)}button:active{transform:scale(.97)}
.in,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;width:100%}
.fl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}.fl .in,.fl select{width:130px}
.sw{width:44px;height:26px;appearance:none;background:var(--bd);border-radius:20px;position:relative;cursor:pointer;transition:.2s}
.sw:checked{background:var(--ac)}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw:checked::after{left:21px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--bd)}
.pill.ok{background:#12a36b22;color:var(--ok)}.pill.wa{background:#e8930c22;color:var(--wa)}.pill.er{background:#e5365a22;color:var(--er)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:16px;min-height:96px;transition:.15s}
.lc b{font-size:34px}.lc:last-child{grid-column:1/-1}.lc.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--cd));transform:scale(1.02)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:10px 12px 10px 16px;font-size:15px}
.chip a{cursor:pointer}.chip i{font-style:normal;cursor:pointer;color:var(--wa);font-size:17px}.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--cd))}
.go{width:100%;margin-top:14px;padding:22px;font-size:20px;font-weight:700;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--a2));border-radius:20px;box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 40%,transparent)}
.go:active{transform:scale(.98)}
.hero{padding:22px}.hero.pz{opacity:.8}
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--a2));border-radius:8px;transition:width .5s}
.act{border:2px solid var(--ac)}.act.urg{border-color:var(--er);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #e5365a33}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.row3 button{color:#fff;font-weight:600;padding:12px 4px}.ok{background:var(--ok)}.wa{background:var(--wa)}.sk{background:#64748b}
.sl{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bd);white-space:nowrap}
.s-done{background:#12a36b26;color:var(--ok)}.s-missed{background:#e5365a26;color:var(--er)}.s-skipped{background:#64748b30}.s-snoozed,.s-due{background:#e8930c26;color:var(--wa)}
.seg{display:flex;background:var(--bd);border-radius:12px;padding:3px;margin:8px 0}.seg button{flex:1;background:none}.seg .on{background:var(--cd);font-weight:600}
.pc{font-size:22px;color:var(--ac)}.det{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px;display:grid;gap:8px}
.tile{text-align:center;margin:0}.tile b{display:block;font-size:26px}.tile span{font-size:12px;color:var(--mu)}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;margin-top:12px}.col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center}
.bb{flex:1;width:100%;display:flex;align-items:flex-end}.bb i{width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--ac),var(--a2))}.col small{font-size:10px;color:var(--mu)}
.stack{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:10px 0;background:var(--bd)}
.fab{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:10;max-width:532px;margin:auto;display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;border-radius:18px;padding:14px 16px;font-size:16px;box-shadow:0 8px 22px rgba(31,168,85,.4)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--mu);border-radius:12px}nav button span{font-size:20px}nav .on{color:var(--ac);font-weight:700;background:color-mix(in srgb,var(--ac) 12%,transparent)}
.ban{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;display:none;flex-direction:column;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:16px;max-width:536px;margin:auto;cursor:pointer}
.ban.show{display:flex;animation:dn .3s}.ban.urg{background:var(--er);color:#fff;animation:dn .3s,pl 1s 3}
@keyframes dn{from{transform:translateY(-20px);opacity:0}}
.ov{position:fixed;inset:0;z-index:30;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px}.sum{max-width:420px;width:100%}
textarea{height:140px;font:12px monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div><h1 id="gr">Hello 👋</h1><small class="mu" id="dt"></small></div><span class="pill ok">⏰ HeyReminder</span></header>
<main id="v"></main>
<div id="ban" class="ban" onclick="go('home')"></div>
<div id="md"></div>
<button id="fab" class="fab" onclick="copyMsg()" style="display:none"></button>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),K="pulse.v1";
const KINDS=[["🏢","I’m in Signet Office","Signet Office"],["🏬","I’m in Another Office","Another Office"],["📍","I’m at Another Location","Another Location"],["🏠","I’m at an Apartment","Apartment"],["🏗️","I’m on a Site Visit","Site Visit"]];
const NAV=[["home","Home","🏠"],["hist","History","📅"],["ins","Insights","📊"],["set","Settings","⚙️"]];
const T={pending:"Upcoming",due:"Due now",snoozed:"Snoozed",done:"Done",skipped:"Skipped",missed:"Missed"},EV={n10:"🔔 10m",n5:"🚨 5m",done:"✓ done",snooze:"⏰ snooze",skip:"↷ skip"};
const DEF={set:{int:105,from:10,to:20,snd:true,style:"normal",vib:true,gps:true,rad:150,hist:false,wa:""},locs:["Kolshet Road","Majiwada","Manpada","Balkum","Dhokali","Lodha Sterling","Kalpataru Immense","Runwal Eirene"],fav:[],kind:null,place:null,sess:null,hist:{},pl:{},gh:[],use:{}};
let S,tab="home",hv="day",wo=0,op=null,qv="",ac,D=null;
function loadS(){const d=JSON.parse(JSON.stringify(DEF));try{S=Object.assign(d,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){S=d}S.set=Object.assign({},DEF.set,S.set);S.locs=S.locs.filter(x=>x!=="Swagat Properties Dhokali");delete S.pl["Swagat Properties Dhokali"];S.fav=S.fav.filter(x=>x!=="Swagat Properties Dhokali")}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const fd=k=>new Date(k+"T12:00").toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});
const dk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const hh=ms=>{const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")};
const at=h=>{const d=new Date();d.setHours(h,0,0,0);return+d};
const hl=h=>(h%12||12)+(h<12?" AM":" PM");
function st(sl){const g=k=>sl.filter(x=>x.st===k).length,tot=sl.length,done=g("done");return{tot,done,miss:g("missed"),skip:g("skipped"),snz:sl.reduce((a,x)=>a+x.sn,0),pct:tot?Math.round(done/tot*100):0}}
function days(){const m={};for(const k in S.hist)m[k]={...S.hist[k],slots:S.hist[k].slots.slice()};
 if(S.sess){const k=dk(S.sess.start);m[k]=m[k]?{...m[k],slots:m[k].slots.concat(S.sess.slots),live:1}:{date:k,start:S.sess.start,loc:S.sess.loc,slots:S.sess.slots,live:1}}return m}
function streak(m){let n=0;const d=new Date();d.setHours(12);const ok=()=>m[dk(d)]&&st(m[dk(d)].slots).done;if(!ok())d.setDate(d.getDate()-1);while(ok()){n++;d.setDate(d.getDate()-1)}return n}
function wk(m,off=0){const r=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12);d.setDate(d.getDate()-i-7*off);const k=dk(d);r.push({k,d:m[k]})}return r}
/* sound, vibration, alerts */
function ctx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(f,t0,d,ty,v){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
function beep(u){if(!S.set.snd)return;if(u)[0,.28,.56,.84].forEach((t,i)=>tone(i%2?988:1318,t,.25,"square",.25));else if(S.set.style==="urgent"){tone(880,0,.2,"square",.2);tone(880,.3,.2,"square",.2)}else{tone(660,0,.5,"sine",.25);tone(880,.2,.5,"sine",.2)}}
function banner(t,b,u,c){const e=$("#ban");e.className="ban show"+(u?" urg":"");e.innerHTML="<b>"+esc(t)+"</b><span>"+esc(b)+"</span>"+(c?'<button class="ok" style="margin-top:8px" onclick="event.stopPropagation();copyMsg()">📋 Copy status message</button>':"");clearTimeout(banner.t);banner.t=setTimeout(()=>e.className="ban",c?20000:u?15000:6000)}
const toast=m=>banner("HeyReminder",m,0);
function notify(t,b,u,tag){beep(u);try{if(S.set.vib&&navigator.vibrate)navigator.vibrate(u?[300,120,300,120,500]:[200])}catch(e){}banner(t,b,u,S.sess&&S.kind!=null);
 try{if("Notification" in window&&Notification.permission==="granted"){const n=new Notification(t,{body:b+"\n"+waMsg(),tag,requireInteraction:!!u});n.onclick=()=>{window.focus();copyMsg()}}}catch(e){}}
function perm(){try{Notification.requestPermission().then(()=>render())}catch(e){toast("This browser doesn’t support notifications")}}
/* session engine: all times are absolute timestamps, re-evaluated against the system clock */
async function start(){ctx();if(S.sess)return;if(Date.now()>=at(S.set.to))return toast("Today’s active hours are over");
 if(!S.set.gps)D={g:{err:"off"},t:Date.now()};
 else if(!(D&&Date.now()-D.t<12e4)){$("#md").innerHTML='<div class="ov"><div class="card sum"><b>Checking your location…</b><p class="mu sm">Allow location access when your browser asks. It’s read once, only to suggest where you are.</p></div></div>';D=await detect();D.t=Date.now()}
 apply(D);confirmUI()}
function begin(){if(S.sess)return;if(S.place)S.use[S.place]=(S.use[S.place]||0)+1;
 const n=Date.now(),w0=at(S.set.from),w1=at(S.set.to);if(n>=w1)return toast("Today’s active hours are over");
 const a=Math.max(n,w0),step=S.set.int*6e4,sl=[];for(let t=a+step,i=0;t<=w1;t+=step,i++)sl.push({id:i,t,st:"pending",n10:0,n5:0,sn:0,ev:[]});
 S.sess={start:n,end:w1,loc:label(),state:"active",slots:sl};save();render();
 if("Notification" in window&&Notification.permission==="default")perm()}
function tick(){const s=S.sess;if(!s)return;const n=Date.now();if(n>=s.end){finish("ended");return}
 const P=s.state==="paused";let ch=0;
 for(const x of s.slots){
  if(x.st==="pending"){
   if(P){if(n>=x.t){x.st="missed";ch=1}continue}
   if(!x.n10&&n>=x.t-6e5){x.n10=1;ch=1;if(n<x.t-6e5+9e4){x.ev.push([n,"n10"]);notify("Your next reminder is approaching!","You have 10 minutes remaining. Please prepare for your next activity.",0,"a"+x.t)}}
   if(!x.n5&&n>=x.t-3e5){x.n5=1;ch=1;if(n<x.t-3e5+9e4){x.ev.push([n,"n5"]);notify("Important Alert – Only 5 Minutes Left!","This is an important reminder. Please take action now.",1,"b"+x.t)}}
   if(n>=x.t){ch=1;if(n>x.t+18e5)x.st="missed";else{x.st="due";x.d=x.t;notify("Time for your reminder","It’s time. Mark it Done, Snooze or Skip.",0,"c"+x.t)}}
  }else if(x.st==="snoozed"&&!P&&n>=x.su){x.st="due";x.d=n;ch=1;notify("Snooze over","Your reminder is waiting.",1,"d"+x.t+"-"+x.sn)}
  else if(x.st==="due"&&n>x.d+18e5){x.st="missed";ch=1}
 }
 if(ch){save();render()}else ui()}
function act(id,a){const x=S.sess.slots.find(y=>y.id===id);if(!x)return;const n=Date.now();
 if(a==="snooze"){x.st="snoozed";x.su=n+3e5;x.sn++}else x.st=a==="done"?"done":"skipped";
 x.ev.push([n,a]);save();render()}
function pz(){const s=S.sess;s.state=s.state==="paused"?"active":"paused";save();render()}
function two(el,fn){if(el.dataset.a)return fn();const o=el.textContent;el.dataset.a=1;el.textContent="Tap again to confirm";setTimeout(()=>{delete el.dataset.a;el.textContent=o},3000)}
function finish(kind){const s=S.sess;if(!s)return;const n=Date.now();
 if(kind==="stopped")s.slots=s.slots.filter(x=>!(x.st==="pending"&&x.t>n));
 s.slots.forEach(x=>{if(["pending","due","snoozed"].includes(x.st))x.st="missed"});
 const k=dk(s.start),h=S.hist[k];if(h)h.slots=h.slots.concat(s.slots);else S.hist[k]={date:k,start:s.start,loc:s.loc,slots:s.slots};
 S.sess=null;save();render();if(kind==="ended")summary(S.hist[k])}
function summary(h){const z=st(h.slots);
 const msg=z.pct>=80?"Outstanding consistency – you’re building a real habit! 🌟":z.pct>=50?"Solid day! Keep the momentum going tomorrow. 💪":z.done?"Every check-in counts. You showed up, and that matters. 🌱":"Tomorrow is a fresh start. One reminder at a time! ☀️";
 $("#md").innerHTML=`<div class="ov" onclick="this.remove()"><div class="card sum" onclick="event.stopPropagation()"><h2>Today’s summary</h2><div class="big" style="color:var(--ac)">${z.pct}%</div><div class="mu">${esc(h.loc)}</div><div class="g2" style="margin:14px 0"><div>Scheduled <b>${z.tot}</b></div><div>Completed <b>${z.done}</b></div><div>Missed <b>${z.miss}</b></div><div>Skipped <b>${z.skip}</b></div></div><p>${msg}</p><button class="go" style="margin:0;padding:14px;font-size:16px" onclick="document.querySelector('.ov').remove()">Close</button></div></div>`}
/* location helpers */
const label=()=>KINDS[S.kind][2]+(S.place?" · "+S.place:"");
function kind(i){S.kind=i;save();render()}
function place(i){const n=S.locs[i],p=S.pl[n];S.place=S.place===n?null:n;if(S.place&&p)S.kind=p.cat;save();render()}
function topLocs(){const t=Object.entries(S.use).filter(([n])=>S.locs.includes(n)).sort((a,b)=>b[1]-a[1]).slice(0,3);return t.length?`<h3>Most used</h3><div class="chips">${t.map(([n,c])=>`<span class="chip ${S.place===n?"on":""}" style="padding-right:16px"><a onclick="place(${S.locs.indexOf(n)})">⭐ ${esc(n)} <span class="mu">${c}×</span></a></span>`).join("")}</div>`:""}
function fav(i){const p=S.locs[i],j=S.fav.indexOf(p);j<0?S.fav.push(p):S.fav.splice(j,1);save();chips()}
function addp(){const v=qv.trim();if(!v)return;if(!S.locs.includes(v))S.locs.push(v);S.place=v;qv="";save();render()}
function chips(){qv=$("#q").value;$("#ch").innerHTML=chipsH(qv)}
function chipsH(q){q=q.trim().toLowerCase();const l=S.locs.filter(x=>x.toLowerCase().includes(q)).sort((a,b)=>S.fav.includes(b)-S.fav.includes(a)||(S.use[b]||0)-(S.use[a]||0));
 return l.map(x=>{const i=S.locs.indexOf(x);return`<span class="chip ${S.place===x?"on":""}"><a onclick="place(${i})">${esc(x)}</a><i onclick="fav(${i})" title="Favourite">${S.fav.includes(x)?"★":"☆"}</i></span>`}).join("")+(q&&!S.locs.some(x=>x.toLowerCase()===q)?`<span class="chip"><a onclick="addp()">＋ Add “${esc(qv.trim())}”</a></span>`:"")}
/* views */
function permBar(){const p="Notification" in window?Notification.permission:"unsupported",t={granted:["ok","Alerts on"],denied:["er","Alerts blocked"],default:["wa","Alerts not enabled"],unsupported:["er","Notifications unsupported"]}[p];
 return`<div class="row sp card sm"><span class="pill ${t[0]}">${t[1]}</span><span class="mu">Sound ${S.set.snd?"on":"off"} · Vibration ${S.set.vib?"on":"off"}</span>${p==="default"?'<button class="b2" onclick="perm()">Enable</button>':p==="denied"?'<span class="mu">Allow in browser settings</span>':""}</div>
 <p class="mu sm">💡 Keep HeyReminder open (or add it to your home screen) so reminders can reach you.</p>`}
function cur(){return S.sess.slots.find(x=>x.st==="due"||x.st==="snoozed"||(x.st==="pending"&&x.n10))}
function vHome(){return permBar()+(S.sess?live():`<h2>Where are you today?</h2>${gpsCard()}<div class="g2">${KINDS.map((k,i)=>`<button class="lc ${S.kind===i?"on":""}" onclick="kind(${i})"><b>${k[0]}</b>${k[1]}</button>`).join("")}</div>${S.kind==null?"":msgCard()}${topLocs()}<div style="margin-top:12px"><input id="q" class="in" placeholder="Search or add a place…" value="${esc(qv)}" oninput="chips()"></div><div id="ch" class="chips">${chipsH(qv)}</div><button class="go" onclick="start()">START MY DAY</button><p class="mu" style="text-align:center">1. Pick your spot · 2. Tap Start · 3. We’ll nudge you every ${Math.floor(S.set.int/60)}h ${S.set.int%60}m between ${hl(S.set.from)} and ${hl(S.set.to)}.</p>`)}
function live(){const s=S.sess,z=st(s.slots),c=cur();
 return`<div class="card hero ${s.state==="paused"?"pz":""}"><div class="mu">${esc(s.loc)} · started ${fm(s.start)}</div><div class="big" id="cd"></div><div class="mu" id="cl"></div><div class="bar"><i style="width:${z.pct}%"></i></div><div class="mu sm">${z.done} of ${z.tot} done · day ends ${fm(s.end)}</div><div class="row" style="margin-top:12px"><button onclick="pz()">${s.state==="paused"?"▶ Resume":"⏸ Pause"}</button><button class="er" onclick="two(this,()=>finish('stopped'))">■ Stop</button></div></div>
 ${c?`<div class="card act ${c.n5||c.st==="due"?"urg":""}"><b>${c.st==="due"?"It’s time!":c.st==="snoozed"?"Snoozed until "+fm(c.su):"Reminder at "+fm(c.t)}</b><div class="mu sm">${c.n5||c.st==="due"?"Please take action now.":"Please prepare for your next activity."}</div><div class="row3"><button class="ok" onclick="act(${c.id},'done')">✓ Done</button><button class="wa" onclick="act(${c.id},'snooze')">⏰ Snooze 5m</button><button class="sk" onclick="act(${c.id},'skip')">↷ Skip</button></div></div>`:""}
 ${msgCard()}<h3>Today’s schedule</h3><div class="chips">${s.slots.map(x=>`<span class="sl s-${x.st}">${fm(x.t)} · ${T[x.st]}</span>`).join("")||'<span class="mu">No reminders fit in today’s window.</span>'}</div>`}
function ui(){const e=$("#cd");if(!e||!S.sess)return;const s=S.sess,n=s.slots.find(x=>x.st==="pending"||x.st==="snoozed"),l=$("#cl");
 if(s.state==="paused"){e.textContent="Paused";l.textContent="Resume to continue notifications";return}
 if(!n){e.textContent="All clear";l.textContent="Summary at "+fm(s.end);return}
 const t=n.st==="snoozed"?n.su:n.t;e.textContent=hh(t-Date.now());l.textContent=n.st==="snoozed"?"until your snoozed reminder":"until the reminder at "+fm(n.t)}
function day(k,d){if(!d)return`<div class="card sm row sp"><b>${fd(k)}</b><span class="mu">No activity</span></div>`;const z=st(d.slots);
 return`<div class="card" onclick="op=op==='${k}'?null:'${k}';render()"><div class="row sp"><div><b>${fd(k)}</b>${d.live?' <span class="pill wa">live</span>':""}<div class="mu sm">${esc(d.loc)} · from ${fm(d.start)}</div></div><b class="pc">${z.pct}%</b></div><div class="bar"><i style="width:${z.pct}%"></i></div><div class="mu sm">${z.done} done · ${z.miss} missed · ${z.skip} skipped · ${z.snz} snoozes</div>
 ${op===k?`<div class="det">${d.slots.map(x=>`<div class="row sp sm"><b>${fm(x.t)}</b><span class="sl s-${x.st}">${T[x.st]}</span><span class="mu">${x.ev.map(e=>EV[e[1]]+" "+fm(e[0])).join(" · ")||"no alerts sent"}</span></div>`).join("")}</div>`:""}</div>`}
function vHist(){const m=days(),seg=`<div class="seg"><button class="${hv==="day"?"on":""}" onclick="hv='day';render()">Daily</button><button class="${hv==="week"?"on":""}" onclick="hv='week';render()">Weekly</button></div>`;
 if(hv==="week"){const r=wk(m,wo),z=st(r.flatMap(x=>x.d?x.d.slots:[]));
  return seg+`<div class="row sp"><button onclick="wo++;render()">‹</button><b>${fd(r[0].k)} – ${fd(r[6].k)}</b><button onclick="wo=Math.max(0,wo-1);render()">›</button></div><div class="card"><div class="mu sm">Week completion</div><div class="big">${z.pct}%</div><div class="bar"><i style="width:${z.pct}%"></i></div><div class="mu sm">${z.done} of ${z.tot} reminders completed</div></div>`+r.map(x=>day(x.k,x.d)).join("")}
 const ks=Object.keys(m).sort().reverse();return seg+(ks.map(k=>day(k,m[k])).join("")||'<div class="card mu">No history yet. Press Start my day on Home to begin.</div>')}
const tile=(v,l)=>`<div class="card tile"><b>${v}</b><span>${l}</span></div>`;
function vIns(){const m=days(),ks=Object.keys(m),z=st(ks.flatMap(k=>m[k].slots)),tk=m[dk(Date.now())],td=tk?st(tk.slots):{pct:0},w=st(wk(m).flatMap(x=>x.d?x.d.slots:[])),sr=streak(m),r=[];
 for(let i=13;i>=0;i--){const d=new Date();d.setHours(12);d.setDate(d.getDate()-i);const k=dk(d);r.push([k,m[k]?st(m[k].slots).pct:0,d.getDate()])}
 const p=x=>z.tot?x/z.tot*100:0;
 return`<h2>Your consistency</h2><div class="g3">${tile(td.pct+"%","Today")}${tile(w.pct+"%","This week")}${tile(sr+" 🔥","Day streak")}${tile(z.tot,"Total")}${tile(z.done,"Completed")}${tile(z.miss,"Missed")}</div>
 <div class="card"><b>Last 14 days</b><div class="chart">${r.map(x=>`<div class="col" title="${fd(x[0])}: ${x[1]}%"><div class="bb"><i style="height:${x[1]}%"></i></div><small>${x[2]}</small></div>`).join("")}</div></div>
 <div class="card"><b>Outcomes</b><div class="stack"><i style="width:${p(z.done)}%;background:var(--ok)"></i><i style="width:${p(z.skip)}%;background:#64748b"></i><i style="width:${p(z.miss)}%;background:var(--er)"></i></div><div class="mu sm">Completed ${z.done} · Skipped ${z.skip} · Missed ${z.miss} · Snoozes ${z.snz}</div></div>
 <p class="mu">${sr>=3?"You’re on a roll – "+sr+" days in a row!":z.done?"Nice progress. Complete one reminder each day to build a streak.":"Complete your first reminder to start tracking your habit."}</p>`}
const hr=v=>Array.from({length:24},(_,h)=>`<option value="${h}" ${h===v?"selected":""}>${hl(h)}</option>`).join("");
const tg=(k,l)=>`<label class="fl">${l}<input type="checkbox" class="sw" ${S.set[k]?"checked":""} onchange="cfg('${k}',this.checked)"></label>`;
function cfg(k,v){S.set[k]=v;save()}
function vSet(){const c=S.set;
 return`<h3>Reminders</h3><div class="card"><label class="fl">Interval (minutes)<input class="in" type="number" min="15" max="480" value="${c.int}" onchange="cfg('int',Math.min(480,Math.max(15,+this.value||105)))"></label><label class="fl">Active from<select onchange="cfg('from',+this.value)">${hr(c.from)}</select></label><label class="fl">Active until<select onchange="cfg('to',+this.value)">${hr(c.to)}</select></label><p class="mu sm">Applies the next time you press Start. Default: every 1h 45m, 10 AM – 8 PM.</p></div>
 <h3>Alerts</h3><div class="card">${tg("snd","Notification sounds")}<label class="fl">10-minute alert sound<select onchange="cfg('style',this.value)"><option value="normal" ${c.style==="normal"?"selected":""}>Normal</option><option value="urgent" ${c.style==="urgent"?"selected":""}>Urgent</option></select></label>${tg("vib","Vibration")}<div class="row"><button onclick="ctx();beep(0)">Test normal</button><button onclick="ctx();beep(1)">Test urgent</button><button onclick="perm()">Allow notifications</button></div></div>
 <h3>Saved locations</h3><div class="card">${S.locs.map((x,i)=>`<div class="fl sm"><div>${esc(x)}${gpsInfo(x,i)}</div><span><button onclick="fav(${i});render()">${S.fav.includes(x)?"★":"☆"}</button> <button onclick="delLoc(${i})">✕</button></span></div>`).join("")}<div class="row" style="margin-top:8px"><input id="np" class="in" style="flex:1" placeholder="New location"><button class="b2" onclick="addLoc()">Add</button></div></div>
 <h3>Location & privacy</h3><div class="card">${tg("gps","Use GPS to detect my location")}<p class="mu sm" style="margin:0 0 6px">Your position is read once when you tap Detect or Start, only to suggest where you are. HeyReminder never tracks you continuously, and coordinates stay on this device. Address lookup uses OpenStreetMap; if it’s unavailable HeyReminder falls back to your saved, pinned places.</p><label class="fl">Default geofence radius<select onchange="cfg('rad',+this.value)">${[50,100,150,300,500].map(v=>`<option value="${v}" ${v===c.rad?"selected":""}>${v} m</option>`).join("")}</select></label>${tg("hist","Keep location history")}<div class="row sp sm"><span class="mu">${S.gh.length} saved check-ins</span><button onclick="S.gh=[];save();render()">Clear</button></div><p class="mu sm" style="margin-bottom:4px">WhatsApp group invite link</p><input class="in" placeholder="https://chat.whatsapp.com/…" value="${esc(c.wa||"")}" onchange="cfg('wa',this.value.trim())"><p class="mu sm">Optional. Adds an Open group button beside Copy message. You paste the message yourself.</p></div><h3>Data</h3><div class="card"><div class="row"><button onclick="exp()">Export history (CSV)</button><button class="er" onclick="two(this,()=>finish('stopped'))" ${S.sess?"":"disabled"}>Stop reminders</button><button class="er" onclick="two(this,resetAll)">Reset everything</button></div><div id="ex"></div></div>`}
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
function locate(){return new Promise(res=>{if(!S.set.gps)return res({err:"off"});if(!navigator.geolocation)return res({err:"unsupported"});
 try{navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>res({err:e.code===1?"denied":e.code===3?"timeout":"unavailable"}),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}catch(e){res({err:"unavailable"})}})}
async function rev(a,b){try{const c=new AbortController();setTimeout(()=>c.abort(),5000);const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat="+a+"&lon="+b,{signal:c.signal}),j=await r.json(),d=j.address||{};return[d.building||d.amenity||d.road,d.neighbourhood||d.suburb||d.village||d.city_district,d.city||d.town].filter(Boolean).join(", ")||j.display_name||null}catch(e){return null}}
async function detect(){const g=await locate(),o={g};if(g.err)return o;o.addr=await rev(g.lat,g.lng);let b=null;
 for(const n in S.pl){const p=S.pl[n],d=dist(g.lat,g.lng,p.lat,p.lng);if(d<=p.r&&(!b||d<b.d))b={n,d}}
 if(!b&&o.addr){const a=o.addr.toLowerCase(),n=S.locs.find(x=>a.includes(x.toLowerCase()));if(n)b={n,d:null}}
 o.m=b;return o}
const conf=o=>o.g.err||!o.m?"":o.m.d==null?"txt":o.g.acc<=Math.max(100,S.pl[o.m.n].r)?"high":"low";
function apply(o){if(conf(o)==="high"){const p=S.pl[o.m.n];S.kind=p.cat;S.place=o.m.n}}
function dTxt(o){const g=o.g;if(g.err)return{off:"GPS detection is off. Choose where you are.",denied:"Location permission was denied. Choose where you are manually.",unsupported:"This browser has no location support. Choose manually.",timeout:"Location timed out. Try again or choose manually.",unavailable:"Location is unavailable. Choose manually."}[g.err];
 return o.m?"Your current location: "+o.m.n:"New location"+(o.addr?" near "+o.addr:" ("+g.lat.toFixed(4)+", "+g.lng.toFixed(4)+")")}
async function detectHome(s){if(!S.set.gps)return toast("GPS detection is off in Settings");if(!s)toast("Checking your location… allow access when asked");D=await detect();D.t=Date.now();apply(D);render();if(!s)banner("HeyReminder",dTxt(D),0)}
function gpsCard(){return`<div class="card sm"><div class="row sp"><b>${D?esc(dTxt(D)):"Detect where you are"}</b><button class="b2" onclick="detectHome()" ${S.set.gps?"":"disabled"}>📍 Detect</button></div><div class="mu" style="margin-top:6px">${D?"":"HeyReminder reads your location once, only when you tap this or Start, to suggest where you are. It never tracks you. "}${Object.keys(S.pl).length?"":"Save a place once and HeyReminder will recognise it next time. "}You can always choose manually below.</div></div>`}
function confirmUI(){const o=D,g=o.g,c=conf(o),cat=S.kind==null?"":KINDS[S.kind][2];
 $("#md").innerHTML=`<div class="ov"><div class="card sum"><h2>Where are you currently?</h2><div class="card" style="margin:0 0 12px"><b>${esc(dTxt(o))}</b>${g.err?"":`<div class="mu sm">±${Math.round(g.acc)} m accuracy</div>`}<div class="row" style="margin-top:8px">${cat?`<span class="pill ok">${cat}</span>`:'<span class="pill wa">Category needed</span>'}${c==="high"?'<span class="pill ok">Confident match</span>':c==="low"?'<span class="pill wa">Low accuracy – please confirm</span>':c==="txt"?'<span class="pill wa">Matched by address</span>':""}</div></div>
 <div id="ed" style="display:${S.kind==null?"block":"none"};margin-bottom:10px"><select id="mk"><option value="">Choose category…</option>${KINDS.map((k,i)=>`<option value="${i}" ${S.kind===i?"selected":""}>${k[2]}</option>`).join("")}</select><input id="mp" list="dl" class="in" style="margin-top:8px" placeholder="Place name (e.g. Majiwada)" value="${esc(!g.err&&!o.m&&o.addr?o.addr.split(",")[0]:S.place||"")}"><datalist id="dl">${S.locs.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
 ${!g.err&&!o.m?'<label class="fl sm">Save this spot for next time (needs a name)<input id="mr" type="checkbox" class="sw" checked></label>':""}
 <div class="row3" style="grid-template-columns:1fr 1fr"><button class="ok" onclick="confirmLoc()">Confirm</button><button class="sk" onclick="$('#ed').style.display='block'">Change location</button></div><button class="b2" style="width:100%;margin-top:8px" onclick="$('#md').innerHTML=''">Cancel</button></div></div>`}
function confirmLoc(){const k=$("#mk").value,p=$("#mp").value.trim();if(k==="")return toast("Choose a category first");S.kind=+k;S.place=p||null;const g=D&&D.g;
 if(p){if(!S.locs.includes(p))S.locs.push(p);const r=$("#mr");if(g&&!g.err&&r&&r.checked)S.pl[p]={lat:g.lat,lng:g.lng,r:S.set.rad,cat:+k}}
 if(S.set.hist&&g&&!g.err){S.gh.push({t:Date.now(),lat:g.lat,lng:g.lng,p:p||""});S.gh=S.gh.slice(-200)}
 $("#md").innerHTML="";save();begin()}
function shareWA(){const m=KINDS[S.kind][1]+(S.place?" ("+S.place+")":""),l=S.set.wa||"",g=/^https:\/\/chat\.whatsapp\.com\//.test(l);
 try{navigator.clipboard.writeText(m)}catch(e){}
 banner(g?"Message copied – paste it in the group":"Opening WhatsApp",m,0);try{window.open(g?l:"https://wa.me/?text="+encodeURIComponent(m),"_blank","noopener")}catch(e){}}
const sel=(a,v,f,i)=>`<select style="width:auto;padding:6px" onchange="setP(${i},'${f}',+this.value)">${a.map(([x,t])=>`<option value="${x}" ${x===v?"selected":""}>${t}</option>`).join("")}</select>`;
function gpsInfo(x,i){const p=S.pl[x];return`<div class="row" style="margin-top:6px"><span class="pill ${p?"ok":""}">${p?"GPS pinned":"No GPS pin"}</span><button onclick="pinHere(${i})">📍 ${p?"Re-pin":"Pin here"}</button>${p?sel([50,100,150,300,500].map(v=>[v,v+" m"]),p.r,"r",i)+sel(KINDS.map((k,j)=>[j,k[2]]),p.cat,"cat",i):""}</div>`}
function setP(i,f,v){S.pl[S.locs[i]][f]=v;save()}
async function pinHere(i){const g=await locate();if(g.err)return toast("Couldn’t get your location ("+g.err+")");const n=S.locs[i],o=S.pl[n];S.pl[n]={lat:g.lat,lng:g.lng,r:o?o.r:S.set.rad,cat:o?o.cat:(S.kind??2)};save();render();toast("Pinned "+n+" (±"+Math.round(g.acc)+" m)")}
function waMsg(){const k=S.kind,p=S.place||(D&&D.addr?D.addr.split(",")[0]:"");if(k==null)return"";
 if(k===0)return"I’m at Signet Office";if(k===1)return"I’m in office";
 if(k===4)return"I’m at "+(p||"the site")+" for site visit.";return"I’m at "+(p||KINDS[k][2])}
function copyMsg(){const m=waMsg(),ok=()=>toast("Copied ✓ – now paste it in your group"),f=()=>{const a=document.createElement("textarea");a.value=m;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let r=false;try{r=document.execCommand("copy")}catch(e){}a.remove();r?ok():toast(m)};
 try{navigator.clipboard.writeText(m).then(ok,f)}catch(e){f()}}
function openWA(){try{window.open(S.set.wa,"_blank","noopener")}catch(e){}}
function msgCard(){return`<div class="card" style="border:2px solid #1fa855"><div class="mu sm">Your status message</div><div style="background:#dcf8c6;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:18px">${esc(waMsg())}</div><div class="row"><button class="ok" style="flex:1" onclick="copyMsg()">📋 Copy message</button>${/^https:\/\/chat\.whatsapp\.com\//.test(S.set.wa||"")?'<button class="b2" onclick="openWA()">Open group</button>':""}</div><p class="mu sm" style="margin:8px 0 0">Tap copy, then paste it in your WhatsApp group.</p></div>`}
function addLoc(){const v=$("#np").value.trim();if(v&&!S.locs.includes(v)){S.locs.push(v);save()}render()}
function delLoc(i){const p=S.locs.splice(i,1)[0];delete S.pl[p];S.fav=S.fav.filter(x=>x!==p);if(S.place===p)S.place=null;save();render()}
function csv(){const m=days();let o="date,location,scheduled,status,alert_10min,alert_5min,snoozes\n";Object.keys(m).sort().forEach(k=>m[k].slots.forEach(x=>{const e=n=>x.ev.some(v=>v[1]===n)?"sent":"no";o+=[k,'"'+m[k].loc.replace(/"/g,'""')+'"',new Date(x.t).toTimeString().slice(0,5),x.st,e("n10"),e("n5"),x.sn].join(",")+"\n"}));return o}
function exp(){$("#ex").innerHTML=`<textarea id="ta" readonly>${esc(csv())}</textarea><button class="b2" onclick="cp()">Copy CSV</button>`}
function cp(){const t=$("#ta");t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Copied"),()=>{document.execCommand("copy");toast("Copied")})}catch(e){try{document.execCommand("copy");toast("Copied")}catch(_){}}}
function resetAll(){S=JSON.parse(JSON.stringify(DEF));save();render();toast("All data cleared")}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark";try{localStorage.setItem("pulse.theme",r.dataset.theme)}catch(e){}}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){const v={home:vHome,hist:vHist,ins:vIns,set:vSet}[tab];$("#v").innerHTML=v();
 $("#nv").innerHTML=NAV.map(n=>`<button class="${tab===n[0]?"on":""}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join("");
 const fb=$("#fab"),fm2=waMsg();fb.style.display=fm2&&tab!=="home"?"flex":"none";fb.textContent="📋 Copy: "+fm2;const h=new Date().getHours();$("#gr").textContent=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+" 👋";$("#dt").textContent=new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});ui()}
loadS();
if(S.sess&&Date.now()>=S.sess.end)finish("ended");else render();
try{navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted"&&S.set.gps&&!S.sess)detectHome(1)})}catch(e){}
setInterval(tick,1000);document.addEventListener("visibilitychange",tick);tick();
</script>
</body>
